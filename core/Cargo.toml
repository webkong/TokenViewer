[package]
name = "tokenviewer-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
rayon = "1.10"
# Build OpenSSL into the native library so packaged apps do not depend on a
# Homebrew path or on the builder's macOS deployment target.
git2 = { version = "0.19", features = ["ssh", "vendored-openssl"] }
walkdir = "2"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
zstd = "0.11"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "std"] }
base64 = "0.22"
libc = "0.2"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["std"] }
hkdf = "0.12"
hmac = "0.12"
rand = "0.8"
sha2 = "0.10"
tar = "0.4"
url = "2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
