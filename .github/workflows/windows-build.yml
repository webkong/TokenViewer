name: Windows Build

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - "core/**"
      - "script/windows-release.ps1"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths:
      - "windows/**"
      - "core/**"
      - "script/windows-release.ps1"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Rust tests
        shell: pwsh
        working-directory: core
        run: cargo test --lib --tests

      - name: .NET tests
        shell: pwsh
        run: dotnet test windows/TokenViewer.Tests/TokenViewer.Tests.csproj -c Release -p:EnableWindowsTargeting=true

      - name: Build artifacts
        shell: pwsh
        env:
          RUST_TARGET: x86_64-pc-windows-msvc
          WINDOWS_RUNTIME: win-x64
          VERSION: 0.1.0
        run: |
          ./script/windows-release.ps1

      - name: Verify brand assets
        shell: pwsh
        run: |
          if (-not (Test-Path 'windows/TokenViewer/Resources/TokenViewer.ico')) { throw "Missing TokenViewer.ico" }
          $logos = @(Get-ChildItem 'windows/TokenViewer/Resources/brand-logos/*.png')
          if ($logos.Count -lt 1) { throw "Missing brand-logo PNGs" }
          Write-Host "OK: TokenViewer.ico + $($logos.Count) brand-logo PNG(s)"

      - name: Verify publish output
        shell: pwsh
        run: |
          $required = @(
            'dist/windows/tokenviewer_core.dll',
            'dist/windows/TokenViewer.exe'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing required artifact: $file" }
            Write-Host "OK: $file"
          }

      - name: Verify zip contents
        shell: pwsh
        run: |
          $zip = 'dist/release/TokenViewer-Windows-win-x64.zip'
          if (-not (Test-Path $zip)) { throw "Missing zip: $zip" }
          $tmp = Join-Path $env:RUNNER_TEMP 'tv-zip-check'
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $tmp
          $required = @(
            (Join-Path $tmp 'TokenViewer.exe'),
            (Join-Path $tmp 'tokenviewer_core.dll'),
            (Join-Path $tmp 'Resources/TokenViewer.ico')
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing in zip: $file" }
            Write-Host "OK: $file"
          }
          $logos = @(Get-ChildItem (Join-Path $tmp 'Resources/brand-logos/*.png'))
          if ($logos.Count -lt 50) { throw "Missing brand PNGs in zip ($($logos.Count) < 50)" }
          Write-Host "OK: zip carries $($logos.Count) brand PNGs"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: tokenviewer-windows
          path: |
            dist/windows
            dist/release/TokenViewer-Windows-win-x64.zip
