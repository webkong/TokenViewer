name: macOS Build

on:
  push:
    branches: [main]
    paths:
      - "macos/**"
      - "core/**"
      - "script/release.sh"
      - "script/version.env"
      - "script/version_utils.sh"
      - "script/self_signed_codesign.sh"
      - ".github/workflows/macos-build.yml"
  pull_request:
    paths:
      - "macos/**"
      - "core/**"
      - "script/release.sh"
      - "script/version.env"
      - "script/version_utils.sh"
      - "script/self_signed_codesign.sh"
      - ".github/workflows/macos-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            core/target
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-rust-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: macos-rust-

      - name: Install packaging tools
        run: brew install create-dmg xcodegen

      - name: Generate Xcode project
        run: cd macos && xcodegen generate

      - name: Rust tests
        working-directory: core
        run: cargo test --lib --tests

      - name: Swift tests
        run: |
          xcodebuild test \
            -project macos/TokenViewer.xcodeproj \
            -scheme TokenViewer \
            -destination 'platform=macOS'

      - name: Prepare ephemeral signing identity
        run: |
          chmod +x script/self_signed_codesign.sh
          ./script/self_signed_codesign.sh generate

      - name: Build DMG and ZIP
        env:
          CODE_SIGN_IDENTITY: "-"
          SKIP_RUST_BUILD: "1"
        run: |
          chmod +x script/release.sh script/version_utils.sh
          ./script/release.sh build-dmg

      - name: Verify package contents
        run: |
          source script/version.env
          APP='dist/release/TokenViewer.app'
          ZIP="dist/release/TokenViewer-${VERSION}.zip"
          DMG='dist/release/TokenViewer.dmg'

          test -d "$APP"
          test -f "$ZIP"
          test -f "$DMG"
          codesign --verify --deep --strict --verbose=2 "$APP"
          test "$(defaults read "$PWD/$APP/Contents/Info" CFBundleShortVersionString)" = "$VERSION"
          if otool -L "$APP/Contents/MacOS/TokenViewer" | grep -E '/opt/homebrew|/usr/local'; then
            echo "Packaged binary depends on a builder-local library" >&2
            exit 1
          fi
          unzip -t "$ZIP"
          hdiutil verify "$DMG"

          MOUNT_DIR="$(mktemp -d)"
          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint "$MOUNT_DIR"
          test -d "$MOUNT_DIR/TokenViewer.app"
          hdiutil detach "$MOUNT_DIR"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: tokenviewer-macos
          path: |
            dist/release/TokenViewer.dmg
            dist/release/TokenViewer-*.zip
