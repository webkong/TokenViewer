name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      publish: ${{ steps.version.outputs.publish }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          unset VERSION BUILD_NUMBER
          source script/version.env
          CONFIG_VERSION="$VERSION"
          CONFIG_BUILD_NUMBER="$BUILD_NUMBER"
          PROJECT_VERSION="$(awk -F: '/MARKETING_VERSION:/ { value=$2; gsub(/[[:space:]"]/, "", value); print value; exit }' macos/project.yml)"
          PROJECT_BUILD_NUMBER="$(awk -F: '/CURRENT_PROJECT_VERSION:/ { value=$2; gsub(/[[:space:]"]/, "", value); print value; exit }' macos/project.yml)"

          if [[ "$CONFIG_VERSION" != "$PROJECT_VERSION" ]]; then
            echo "Version mismatch: script/version.env=$CONFIG_VERSION, macos/project.yml=$PROJECT_VERSION" >&2
            exit 1
          fi
          if [[ "$CONFIG_BUILD_NUMBER" != "$PROJECT_BUILD_NUMBER" ]]; then
            echo "Build number mismatch: script/version.env=$CONFIG_BUILD_NUMBER, macos/project.yml=$PROJECT_BUILD_NUMBER" >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tag must use vX.Y.Z format: $GITHUB_REF_NAME" >&2
              exit 1
            fi
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$CONFIG_VERSION" ]]; then
              echo "Tag version $TAG_VERSION does not match configured version $CONFIG_VERSION" >&2
              exit 1
            fi
            PUBLISH=true
          else
            TAG_VERSION="$CONFIG_VERSION"
            PUBLISH=false
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$CONFIG_BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            macos_arch: arm64
            rust_target: aarch64-apple-darwin
            package_arch: arm64
            package_pkg: TokenViewer-Installer.pkg
            stable_aliases: true
          - runner: macos-15-intel
            macos_arch: x86_64
            rust_target: x86_64-apple-darwin
            package_arch: x64
            package_pkg: TokenViewer-macOS-x64-Installer.pkg
            stable_aliases: false
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      MACOS_ARCH: ${{ matrix.macos_arch }}
      MACOS_RUST_TARGET: ${{ matrix.rust_target }}
      PACKAGE_ARCH: ${{ matrix.package_arch }}
      PACKAGE_PKG: ${{ matrix.package_pkg }}
      STABLE_ALIASES: ${{ matrix.stable_aliases }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            core/target
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-${{ matrix.package_arch }}-rust-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: macos-${{ matrix.package_arch }}-rust-

      - name: Install packaging tools
        run: brew install create-dmg xcodegen

      - name: Generate Xcode project
        run: cd macos && xcodegen generate

      - name: Rust tests
        working-directory: core
        run: cargo test --lib --tests

      - name: Swift tests
        run: |
          xcodebuild test \
            -project macos/TokenViewer.xcodeproj \
            -scheme TokenViewer \
            -destination 'platform=macOS' \
            ARCHS="$MACOS_ARCH" \
            ONLY_ACTIVE_ARCH=YES \
            TOKENVIEWER_RUST_TARGET="$MACOS_RUST_TARGET"

      - name: Prepare ephemeral signing identity
        run: |
          chmod +x script/self_signed_codesign.sh
          ./script/self_signed_codesign.sh generate

      - name: Build release packages
        env:
          CODE_SIGN_IDENTITY: "-"
          SKIP_RUST_BUILD: "1"
        run: |
          chmod +x script/release.sh script/version_utils.sh
          ./script/release.sh build-release

          ARCH_DMG="TokenViewer-${VERSION}-macOS-${PACKAGE_ARCH}.dmg"
          ARCH_ZIP="TokenViewer-${VERSION}-macOS-${PACKAGE_ARCH}.zip"
          VERSIONED_PKG="TokenViewer-${VERSION}-Installer.pkg"
          cp dist/release/TokenViewer.dmg "dist/release/$ARCH_DMG"
          cp "dist/release/TokenViewer-${VERSION}.zip" "dist/release/$ARCH_ZIP"
          if [[ "$PACKAGE_PKG" != 'TokenViewer-Installer.pkg' ]]; then
            cp "dist/release/$VERSIONED_PKG" "dist/release/$PACKAGE_PKG"
          fi

          UPLOAD_DIR='dist/release/upload'
          rm -rf "$UPLOAD_DIR"
          mkdir -p "$UPLOAD_DIR"
          cp "dist/release/$ARCH_DMG" "dist/release/$ARCH_ZIP" "$UPLOAD_DIR/"
          if [[ "$STABLE_ALIASES" == 'true' ]]; then
            cp "dist/release/$VERSIONED_PKG" "$UPLOAD_DIR/"
            cp dist/release/TokenViewer.dmg dist/release/TokenViewer-Installer.pkg "$UPLOAD_DIR/"
          else
            cp "dist/release/$PACKAGE_PKG" "$UPLOAD_DIR/TokenViewer-${VERSION}-macOS-${PACKAGE_ARCH}-Installer.pkg"
          fi

      - name: Verify release packages
        run: |
          APP='dist/release/TokenViewer.app'
          DMG='dist/release/TokenViewer.dmg'
          ARCH_DMG="dist/release/TokenViewer-${VERSION}-macOS-${PACKAGE_ARCH}.dmg"
          ZIP="dist/release/TokenViewer-${VERSION}-macOS-${PACKAGE_ARCH}.zip"
          PKG="dist/release/TokenViewer-${VERSION}-Installer.pkg"

          test -d "$APP"
          test -f "$DMG"
          test -f "$ARCH_DMG"
          test -f "$ZIP"
          test -f "$PKG"
          test -f 'dist/release/TokenViewer-Installer.pkg'
          codesign --verify --deep --strict --verbose=2 "$APP"
          test "$(lipo -archs "$APP/Contents/MacOS/TokenViewer")" = "$MACOS_ARCH"
          test "$(defaults read "$PWD/$APP/Contents/Info" CFBundleShortVersionString)" = "$VERSION"
          if otool -L "$APP/Contents/MacOS/TokenViewer" | grep -E '/opt/homebrew|/usr/local'; then
            echo "Packaged binary depends on a builder-local library" >&2
            exit 1
          fi
          unzip -t "$ZIP"
          pkgutil --payload-files "$PKG" > "$RUNNER_TEMP/tokenviewer-pkg-files.txt"
          grep -q 'TokenViewer.app/Contents/MacOS/TokenViewer' "$RUNNER_TEMP/tokenviewer-pkg-files.txt"
          hdiutil verify "$DMG"

          MOUNT_DIR="$(mktemp -d)"
          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint "$MOUNT_DIR"
          test -d "$MOUNT_DIR/TokenViewer.app"
          hdiutil detach "$MOUNT_DIR"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: tokenviewer-macos-${{ matrix.package_arch }}-${{ env.VERSION }}
          path: dist/release/upload/*

  windows:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RUST_TARGET: x86_64-pc-windows-msvc
      WINDOWS_RUNTIME: win-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Rust tests
        shell: pwsh
        working-directory: core
        run: cargo test --lib --tests

      - name: .NET tests
        shell: pwsh
        run: dotnet test windows/TokenViewer.Tests/TokenViewer.Tests.csproj -c Release -p:EnableWindowsTargeting=true

      - name: Build release package
        shell: pwsh
        run: ./script/windows-release.ps1

      - name: Verify release package
        shell: pwsh
        run: |
          $zip = "dist/release/TokenViewer-$env:VERSION-Windows-x64.zip"
          $required = @(
            'dist/windows/tokenviewer_core.dll',
            'dist/windows/TokenViewer.exe',
            'windows/TokenViewer/Resources/TokenViewer.ico',
            $zip
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing required artifact: $file" }
          }

          $tmp = Join-Path $env:RUNNER_TEMP 'tokenviewer-windows-zip'
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $tmp
          foreach ($file in @('TokenViewer.exe', 'tokenviewer_core.dll', 'Resources/TokenViewer.ico')) {
            if (-not (Test-Path (Join-Path $tmp $file))) { throw "Missing in zip: $file" }
          }
          $logos = @(Get-ChildItem (Join-Path $tmp 'Resources/brand-logos/*.png'))
          if ($logos.Count -lt 50) { throw "Missing brand PNGs in zip ($($logos.Count) < 50)" }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: tokenviewer-windows-${{ env.VERSION }}
          path: dist/release/TokenViewer-${{ env.VERSION }}-Windows-x64.zip

  publish:
    needs: [prepare, macos, windows]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Download macOS ARM64 packages
        uses: actions/download-artifact@v4
        with:
          name: tokenviewer-macos-arm64-${{ env.VERSION }}
          path: release-assets

      - name: Download macOS Intel packages
        uses: actions/download-artifact@v4
        with:
          name: tokenviewer-macos-x64-${{ env.VERSION }}
          path: release-assets

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: tokenviewer-windows-${{ env.VERSION }}
          path: release-assets

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail

          expected=(
            'TokenViewer.dmg'
            "TokenViewer-${VERSION}-macOS-arm64.dmg"
            "TokenViewer-${VERSION}-macOS-arm64.zip"
            "TokenViewer-${VERSION}-Installer.pkg"
            'TokenViewer-Installer.pkg'
            "TokenViewer-${VERSION}-macOS-x64.dmg"
            "TokenViewer-${VERSION}-macOS-x64.zip"
            "TokenViewer-${VERSION}-macOS-x64-Installer.pkg"
            "TokenViewer-${VERSION}-Windows-x64.zip"
          )
          assets=()
          for name in "${expected[@]}"; do
            path="release-assets/$name"
            test -f "$path"
            assets+=("$path")
          done

          notes_file="docs/releases/${RELEASE_TAG}.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            edit_args=(--title "TokenViewer $VERSION")
            if [[ -f "$notes_file" ]]; then
              edit_args+=(--notes-file "$notes_file")
            fi
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${edit_args[@]}"
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            notes_args=(--generate-notes)
            if [[ -f "$notes_file" ]]; then
              notes_args=(--notes-file "$notes_file")
            fi
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --latest \
              --title "TokenViewer $VERSION" \
              "${notes_args[@]}"
          fi
